<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Cricket Scorer — offline scoring &amp; tournaments</title>
<meta name="description" content="Ball-by-ball cricket scoring with full scorecards, tournaments, points tables and player stats. Works completely offline. No account, no server.">
<meta name="author" content="Kishor Kharade">
<meta name="theme-color" content="#111928">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cricket Scorer">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./src/css/app.css">
<script>
  /* Set the theme before the first paint, so a light-mode user never sees a
     dark flash. Reads the same store the app uses; falls back to dark. */
  (function () {
    try {
      var db = JSON.parse(localStorage.getItem('cricket-scorer.db.v1') || '{}');
      var pref = (db.settings && db.settings.theme) || 'dark';
      var light = pref === 'light' ||
        (pref === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', light ? '#ffffff' : '#111928');
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  })();
</script>
</head>
<body class="app-shell">

  <!-- top bar -->
  <header id="topbar" class="shrink-0 z-40 chrome chrome-top"
          style="padding-top:env(safe-area-inset-top,0px)">
    <div class="mx-auto max-w-3xl px-4 h-14 flex items-center gap-3">
      <button id="backBtn" class="hidden shrink-0 h-9 w-9 rounded-xl bg-white/5 border border-white/10 grid place-items-center active:scale-90 transition" aria-label="Go back">
        <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>

      <!-- App mark. Sits where the back arrow would be, on the top-level screens. -->
      <span id="brandLogo" class="shrink-0 h-9 w-9 rounded-xl grid place-items-center
            bg-gradient-to-br from-rose-500/20 to-rose-600/5 border border-rose-500/25" aria-hidden="true">
        <svg viewBox="0 0 64 64" class="h-7 w-7" role="img">
          <defs>
            <radialGradient id="ballG" cx="35%" cy="30%" r="75%">
              <stop offset="0" stop-color="#fb7185"/><stop offset="55%" stop-color="#e11d48"/><stop offset="1" stop-color="#8d1533"/>
            </radialGradient>
            <linearGradient id="willowG" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#b9884b"/><stop offset=".5" stop-color="#e6bc7a"/><stop offset="1" stop-color="#ad7c42"/>
            </linearGradient>
          </defs>
          <g transform="rotate(28 30 30)">
            <rect x="26.9" y="3.5" width="6.2" height="12.5" rx="3.1" fill="#4a301e"/>
            <rect x="23.6" y="13.6" width="12.8" height="35" rx="5.4" fill="url(#willowG)"/>
          </g>
          <circle cx="41.5" cy="43" r="12.4" fill="url(#ballG)"/>
          <path d="M44.6 31.6c-4.4 3.6-4.4 19.2 0 22.8" fill="none" stroke="#fcf7ec" stroke-width="1.3" stroke-linecap="round"/>
          <g stroke="#fcf7ec" stroke-width="1" stroke-linecap="round" opacity=".92">
            <path d="M40.6 35.4l3-1M40 39.4l3.2-.5M39.8 43h3.2M40 46.6l3.2.5M40.6 50.6l3 1"/>
          </g>
        </svg>
      </span>
      <div class="min-w-0 flex-1">
        <h1 id="pageTitle" class="text-base font-bold text-white truncate">Cricket Scorer</h1>
        <p id="pageSub" class="text-[11px] text-slate-500 truncate"></p>
      </div>
      <div id="pageActions" class="flex items-center gap-2 shrink-0"></div>
    </div>
  </header>

  <!-- routed content -->
  <main id="scroller" class="flex-1 min-h-0 overflow-y-auto overscroll-contain">
    <div id="app" class="mx-auto max-w-3xl px-4 pt-4 pb-8"></div>
  </main>

  <!-- bottom navigation -->
  <nav id="nav" class="shrink-0 z-40 chrome chrome-bottom safe-b">
    <div class="mx-auto max-w-3xl grid grid-cols-5">
      <a href="#/" data-nav="home" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span>Home</span></a>
      <a href="#/matches" data-nav="matches" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6c3 2.2 4.8 6.9 3.3 12.4M18.4 5.6c-3 2.2-4.8 6.9-3.3 12.4"/></svg>
        <span>Matches</span></a>
      <a href="#/match/new" data-nav="new" class="nav-item">
        <span class="grid place-items-center h-11 w-11 -mt-5 rounded-2xl bg-emerald-500 text-onaccent shadow-lg shadow-emerald-500/30 active:scale-90 transition">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </span>
        <span class="mt-0.5">New</span></a>
      <a href="#/tournaments" data-nav="cups" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/><path d="M10 14h4l.6 3.5H9.4L10 14ZM7.5 20.5h9"/></svg>
        <span>Cups</span></a>
      <a href="#/stats" data-nav="stats" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Stats</span></a>
    </div>
    <p class="pb-1.5 -mt-0.5 text-center text-[9px] leading-none tracking-wide text-slate-600 select-none">
      Cricket Scorer · by <span class="font-semibold text-slate-500">Kishor Kharade</span>
    </p>
  </nav>

  <!-- bottom sheet / modal host -->
  <div id="sheet" class="hidden"></div>
  <!-- boundary / wicket celebration host -->
  <div id="fx" class="pointer-events-none fixed inset-0 z-[70] hidden grid place-items-center"></div>

  <noscript><p class="p-6 text-center text-slate-300">Cricket Scorer needs JavaScript enabled.</p></noscript>
  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
